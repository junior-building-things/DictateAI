name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Derive release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Releases must be Developer ID signed: an ad-hoc build changes code
      # identity, so every update would re-prompt for the Keychain and wipe the
      # Microphone / Accessibility grants on every installed copy.
      - name: Require signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      # Tauri imports the certificate into a temporary keychain, signs with
      # the Developer ID identity, then notarizes and staples the app.
      - name: Build macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Thomas Oefverstroem (Q2V7263T69)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: Q2V7263T69
        run: |
          # llama.cpp's bundled cpp-httplib doesn't compile against OpenSSL 4.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Verify signature and notarization
        run: |
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DictateAI.app
          codesign -dvvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Signature"
          codesign -dvvv "$app" 2>&1 | grep -q "TeamIdentifier=Q2V7263T69"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"

      - name: Create updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/create-updater-artifacts.sh "${VERSION}" "${GITHUB_REF_NAME}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DictateAI ${{ github.ref_name }}
          body: |
            Signed updater artifacts for DictateAI.

            Website installers remain separate; installed apps should use the in-app updater.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/DictateAI_${{ env.VERSION }}_aarch64.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DictateAI.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DictateAI.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/latest.json
          fail_on_unmatched_files: true
          overwrite_files: true
